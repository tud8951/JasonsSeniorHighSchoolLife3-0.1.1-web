name: Build & Deploy Ren'Py Web to Pages

on:
  push:
    branches: [ main ]  # 推送到main时自动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 Ren'Py SDK + Web 支持
      - name: Install Ren'Py
        uses: PaxlavaGames/renpy-install@v0.3.0
        with:
          version: "8.3.0"  # 改成你用的版本
          download_web: "yes"

      # 自动构建 Web 版
      - name: Build Ren'Py Web
        uses: PaxlavaGames/renpy-web-build@v0.2.0
        with:
          path: "."  # 项目根目录（有game/文件夹）

      # 上传并部署到 Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
